name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: invitation_test
          POSTGRES_PASSWORD: local_ci_fixture_only
          POSTGRES_DB: invitation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invitation_test -d invitation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:structure
      - run: npm run typecheck
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://invitation_test:local_ci_fixture_only@127.0.0.1:5432/invitation_test
      - name: Test document, storage, auth and both SQL engines
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://invitation_test:local_ci_fixture_only@127.0.0.1:5432/invitation_test
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: test-results/
